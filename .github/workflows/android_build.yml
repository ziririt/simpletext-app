# 안드로이드 APK 자동 빌드 (로드맵 6번 — 시험 설치용)
#
# 윈도우와 같은 구조다. main에 올릴 때마다 APK를 만들어 두고,
# GitHub Actions의 Artifacts에서 받아 안드로이드 기기에 바로 설치해 볼 수 있다.
#
# 주의: 지금은 서명이 개발용(debug) 키다. 시험 설치는 되지만
# 구글 플레이에는 올릴 수 없다. 플레이 출시용 서명은 나중에
# 소유자가 키스토어를 만들고 Secret으로 넣는 단계가 따로 필요하다
# (TestFlight와 같은 방식 — docs/testflight_setup.md의 구조를 그대로 따라가면 된다).
name: Build Android

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: 의존성 내려받기
        run: flutter pub get

      # 깨진 코드를 기기로 보내지 않는다 (윈도우 워크플로와 같은 원칙)
      - name: 엔진 테스트
        run: flutter test

      - name: 버전 읽기
        id: ver
        run: |
          V=$(grep '^version:' pubspec.yaml | sed 's/version: *//' | cut -d'+' -f1)
          echo "version=$V" >> "$GITHUB_OUTPUT"

      # 기기별 최적화 분할 없이 하나로 만든다. 받는 사람이 어느 파일을
      # 골라야 하는지 몰라 헤매는 것보다 낫다(시험 설치용이라 용량은 문제되지 않는다).
      - name: APK 빌드
        run: |
          flutter build apk --release \
            --build-name="${{ steps.ver.outputs.version }}" \
            --build-number="${{ github.run_number }}"

      - name: 설치 안내문 넣기
        run: |
          cat > build/app/outputs/flutter-apk/읽어보세요.txt <<'EOF'
          SimpleText (Android 시험 설치용)

          설치 방법
            app-release.apk 파일을 안드로이드 기기로 옮긴 뒤 눌러서 설치합니다.
            "출처를 알 수 없는 앱" 경고가 뜨면 허용해 주세요.
            구글 플레이를 거치지 않은 앱이라 나오는 정상적인 경고입니다.

          주의
            이 APK는 개발용 서명이 되어 있어 시험 설치 전용입니다.
            구글 플레이에는 이 파일을 올릴 수 없습니다.
          EOF

      - name: APK 올리기
        uses: actions/upload-artifact@v4
        with:
          name: SimpleText-android-v${{ steps.ver.outputs.version }}-build${{ github.run_number }}
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/flutter-apk/읽어보세요.txt
