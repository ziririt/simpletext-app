# 아이폰 TestFlight 자동 배포 (로드맵 3번)
#
# 왜 필요한가 — 노하우 문서 5절:
#   "무선 개발 설치는 생각보다 자주 실패한다. 오늘만 다섯 번 막혔다.
#    기기 잠금, Wi-Fi 상태, 회사망의 단말 간 차단, Xcode의 '이전 준비 오류'…
#    그래서 TestFlight CI가 로드맵에 있는 건 옳은 판단이다."
# 이 경로로 올리면 맥을 켜지 않아도 폰에서 앱을 받을 수 있고,
# "설치가 안 되는 날"에 하루를 날리지 않는다.
#
# 자동으로 돌지 않는다. 손으로 눌러 실행하거나(workflow_dispatch),
# v로 시작하는 태그를 올릴 때만 돈다. 평상시 CI를 빨갛게 만들지 않기 위해서다.
#
# 필요한 GitHub Secrets — 만드는 방법은 docs/testflight_setup.md 참고:
#   APP_STORE_CONNECT_ISSUER_ID   App Store Connect API 발급자 ID
#   APP_STORE_CONNECT_KEY_ID      API 키 ID
#   APP_STORE_CONNECT_P8          API 키(.p8) 파일 내용 전체
#   IOS_DIST_CERT_P12_BASE64      배포 인증서(.p12)를 base64로 바꾼 값
#   IOS_DIST_CERT_PASSWORD        그 .p12에 걸어 둔 암호
#   IOS_PROVISIONING_PROFILE_BASE64  프로비저닝 프로파일을 base64로 바꾼 값
name: iOS TestFlight

on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  testflight:
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      # 비밀값이 하나라도 없으면 여기서 분명한 메시지로 멈춘다.
      # 빌드를 30분 돌린 뒤 마지막에 실패하는 것보다 낫다.
      - name: 필요한 Secrets 확인
        env:
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          P8: ${{ secrets.APP_STORE_CONNECT_P8 }}
          CERT: ${{ secrets.IOS_DIST_CERT_P12_BASE64 }}
          CERT_PW: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
          PROFILE: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          missing=""
          [ -z "$ISSUER_ID" ] && missing="$missing APP_STORE_CONNECT_ISSUER_ID"
          [ -z "$KEY_ID" ]    && missing="$missing APP_STORE_CONNECT_KEY_ID"
          [ -z "$P8" ]        && missing="$missing APP_STORE_CONNECT_P8"
          [ -z "$CERT" ]      && missing="$missing IOS_DIST_CERT_P12_BASE64"
          [ -z "$CERT_PW" ]   && missing="$missing IOS_DIST_CERT_PASSWORD"
          [ -z "$PROFILE" ]   && missing="$missing IOS_PROVISIONING_PROFILE_BASE64"
          if [ -n "$missing" ]; then
            echo "다음 Secret이 등록되어 있지 않습니다:$missing"
            echo "만드는 방법: docs/testflight_setup.md"
            exit 1
          fi
          echo "필요한 Secret 6개 모두 확인"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: 의존성 내려받기
        run: flutter pub get

      # 엔진 테스트를 먼저 돌린다. 깨진 코드를 TestFlight로 올리지 않기 위해서다.
      - name: 테스트
        run: flutter test

      - name: 서명 준비 (임시 키체인)
        env:
          CERT: ${{ secrets.IOS_DIST_CERT_P12_BASE64 }}
          CERT_PW: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
          PROFILE: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          # 이 실행에서만 쓰는 키체인을 만든다. 러너는 매번 새로 만들어지고 버려진다.
          KEYCHAIN=$RUNNER_TEMP/build.keychain
          KEYCHAIN_PW=$(uuidgen)
          security create-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"

          echo "$CERT" | base64 --decode > "$RUNNER_TEMP/dist.p12"
          security import "$RUNNER_TEMP/dist.p12" -k "$KEYCHAIN" -P "$CERT_PW" \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PW" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')

          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo "$PROFILE" | base64 --decode \
            > ~/Library/MobileDevice/Provisioning\ Profiles/dist.mobileprovision

          rm -f "$RUNNER_TEMP/dist.p12"
          echo "서명 준비 완료"

      # TestFlight는 같은 빌드 번호를 두 번 받지 않는다.
      # 실행 번호를 그대로 빌드 번호로 쓰면 절대 겹치지 않는다.
      - name: 빌드 번호 지정
        run: |
          set -euo pipefail
          VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: *//' | cut -d'+' -f1)
          echo "버전 $VERSION / 빌드 ${GITHUB_RUN_NUMBER}"
          echo "BUILD_NAME=$VERSION" >> "$GITHUB_ENV"
          echo "BUILD_NUMBER=${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"

      - name: IPA 빌드
        run: |
          set -euo pipefail
          flutter build ipa --release \
            --build-name="$BUILD_NAME" \
            --build-number="$BUILD_NUMBER" \
            --export-options-plist=ios/ExportOptions.plist

      - name: TestFlight 업로드
        env:
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          P8: ${{ secrets.APP_STORE_CONNECT_P8 }}
        run: |
          set -euo pipefail
          # altool은 이 경로에서 .p8을 찾는다
          mkdir -p ~/private_keys
          echo "$P8" > ~/private_keys/AuthKey_${KEY_ID}.p8

          IPA=$(find build/ios/ipa -name '*.ipa' | head -1)
          if [ -z "$IPA" ]; then
            echo "IPA를 찾지 못했습니다."
            exit 1
          fi
          echo "업로드: $IPA"
          xcrun altool --upload-app -f "$IPA" -t ios \
            --apiKey "$KEY_ID" --apiIssuer "$ISSUER_ID"

          rm -f ~/private_keys/AuthKey_${KEY_ID}.p8
          echo "업로드 완료 — App Store Connect에서 처리까지 몇 분 걸립니다."

      - name: 뒷정리
        if: always()
        run: |
          rm -f ~/Library/MobileDevice/Provisioning\ Profiles/dist.mobileprovision || true
          security delete-keychain "$RUNNER_TEMP/build.keychain" 2>/dev/null || true
